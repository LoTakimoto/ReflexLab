<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReflexLab</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <main class="screen">
        <div id="startScreen" class="start-screen">
            <img src="assets/relflex3.png" alt="ReflexLab" class="logo" />
            <p class="start-text">test your reaction time!</p>
            <button id="startButton" class="start-button">Start</button>
            <button id="settingsButton" class="settings-button">Settings</button>
        </div>

        <div id="settingsScreen" class="settings-screen hidden">
            <h2 class="settings-title">Settings</h2>

            <div class="setting-row">
                <span>Mode:</span>
                <div class="button-row">
                    <button id="darkModeButton" class="settings-button">Dark</button>
                    <button id="lightModeButton" class="settings-button">Light</button>

                </div>
            </div>

            <div class="setting-row">
                <span>Sound:</span>
                <button id="muteButton" class="settings-button">Mute</button>
            </div>

            <button id="backButton" class="settings-button">Back</button>
            
        </div>


         
        <div id="game" class="hidden">
            <div id="area" class="area" role="button" tabindex="0" aria-label="Reaction time test area">
                <p id="message" class="message">click to start</p>
                <p id="result" class="result"></p>
            </div>

            <p class="instructions">Click the panel, wait for it to turn green, then click as fast as you can!</p>

            <ul id="history" class="history"></ul>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
