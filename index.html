<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Think Fast!</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <main class="screen">
        <h1 class="title">Think Fast!</h1>

        <div id="area" class="area" role="button" tabindex="0" aria-label="Reaction time test area">
            <p id="message" class="message">click to start</p>
            <p id="result" class="result"></p>
        </div>

        <p class="instructions">click the panel, wait for it to turn green, then click as fast as you can!</p>

        <ul id="history" class="history"></ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
